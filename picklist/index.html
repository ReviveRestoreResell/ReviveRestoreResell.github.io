<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RRR Pick List</title>
<style id="s">
  /* Tracie's ruled boho-minimalist palette (2026-08-14). Committed single-theme. */
  :root{
    --bg:#faf6f0; --card:#fffdfa; --ink:#3b352d; --mute:#94897a;
    --line:#e9e0d3; --key:#b07253; --warn:#9d6b1f; --warnbg:#fbf3e6;
    --move:#7a5ea8; --movebg:#f4f0fa; --done:#5f7452; --donebg:#f1f5ed;
    --local:#a4560a; --localbg:#fdf2e6;
    --unk:#a63d33; --unkbg:#fbeeec;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;padding:24px 18px calc(86px + env(safe-area-inset-bottom));
    background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:700px;margin:0 auto}
  h1{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.2;
    margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--mute);font-size:13.5px}
  .build{margin:2px 0 0;font-size:12px;color:var(--mute);letter-spacing:.02em}
  .live{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;
    letter-spacing:.08em;padding:2px 7px;border-radius:100px;
    background:var(--donebg);color:var(--done);vertical-align:1px}
  .live.saving{background:var(--warnbg);color:var(--warn)}
  .live.ro{background:#eef1f5;color:#69727e}
  .rack{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--mute);
    margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .item{display:flex;gap:15px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:11px;
    cursor:pointer;user-select:none;-webkit-user-select:none;}
  .num{flex:0 0 27px;height:27px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
    margin-top:1px;}
  .body{flex:1;min-width:0}
  .l1{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;
    font-weight:600;letter-spacing:-.01em}
  .l1 .sku{color:var(--key)} .l1 .cat{color:var(--mute);font-weight:500}
  .l1 .sep{color:#c4cad2;font-weight:400;padding:0 3px}
  .when{font-size:11.5px;color:var(--done);margin-top:4px}
  .detail{margin-top:6px}
  .l2{font-size:17px;font-weight:600;margin-bottom:3px}
  .l3{font-size:13.5px;line-height:1.4;color:#3a424e;margin-bottom:5px}
  .l4{font-size:12.5px;color:var(--mute)}
  .l4 b{color:var(--ink);font-weight:600}
  .mig{margin-top:7px;font-size:12px;color:var(--mute);display:flex;gap:7px;align-items:baseline}
  .mig .chip{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.08em;
    padding:2px 6px;border-radius:3px;background:#eef1f5;color:#69727e}
  .mig .from{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .note{margin-top:9px;padding:7px 10px;background:var(--warnbg);border-left:3px solid var(--warn);
    border-radius:0 5px 5px 0;font-size:12.5px;color:#7c4a06}
  .flagged-note{margin-top:9px;padding:7px 10px;background:var(--unkbg);border-left:3px solid var(--unk);
    border-radius:0 5px 5px 0;font-size:12.5px;color:#7f1d1d}
  .flagbtn{font:inherit;font-size:11px;font-weight:600;letter-spacing:.03em;
    margin-top:9px;padding:5px 11px;border-radius:100px;border:1px solid var(--line);
    background:transparent;color:var(--mute);cursor:pointer;
    -webkit-appearance:none;appearance:none;}
  .item.flagged .flagbtn{border-color:#f0b4b4;color:var(--unk)}
  .item.picked{background:var(--donebg);border-color:#cfead8;padding-top:11px;padding-bottom:11px}
  .item.picked .num{background:var(--done)}
  .item.picked .l1{opacity:.5;text-decoration:line-through;
    text-decoration-color:rgba(21,128,61,.45)}
  .item.picked .detail{display:none}
  .gap{margin:18px 0 0;font-size:12px;color:#92400e;text-align:center}
  .hint{margin-top:16px;font-size:12px;color:var(--mute);text-align:center}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:9;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,253,250,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);}
  .barin{max-width:700px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px}
  .count{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .dots{flex:1;display:flex;gap:5px}
  .dot{flex:1;height:6px;border-radius:3px;background:#e0e4e9}
  .dot.on{background:var(--done)}
  .reset{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);
    color:var(--mute);border-radius:7px;padding:7px 13px;cursor:pointer;
    -webkit-appearance:none;appearance:none;}
  footer{margin-top:22px;font-size:12px;color:var(--mute);text-align:center;line-height:1.6}
  @media print{
    body{background:#fff;padding:0}
    .bar,.hint,.flagbtn{display:none}
    .item{break-inside:avoid;cursor:auto}
    .item.picked{background:#fff;padding:15px 17px}
    .item.picked .detail{display:block}
    .item.picked .l1{opacity:1;text-decoration:none}
  }
</style></head><body>

<div class="wrap">
  <h1 id="h-title">Pick List</h1>
  <div class="sub" id="h-sub"></div>
  <div class="build"><span id="h-build"></span><span class="live" id="savechip">SAVES ON TAP</span></div>
  <div id="app"></div>
  <div class="hint">Tap a row to mark it picked — it publishes itself a moment later,
  so it holds on every device and Claude reads it in the morning.</div>
</div>
<div class="bar"><div class="barin">
  <span class="count" id="count"></span>
  <span class="dots" id="dots"></span>
  <button class="reset" type="button" id="unpick">Reset</button>
</div></div>
<footer>RRR sold pick list · self-saving card (v2.4 delivery)</footer>

<script type="application/json" id="state">{
 "schema": "rrr-picklist-state/1",
 "date": "2026-09-23",
 "title": "Pick List — Wednesday, Sep 23 2026",
 "sub": "2 items · Depop 1 · FBMP 1",
 "build": "build 1 · 6:23 am · sold-pick-list v3.0",
 "gap": "",
 "items": [
  {
   "key": "Depop:475880366779",
   "rack": "POD 1 · RACK 13",
   "bin": "LA10",
   "legacy": "290",
   "cat": "TOPS-0074",
   "color": "Black Tops",
   "title": "J.Crew Vintage Wash Cotton Jersey Pocket T-shirt Mens M Black Relaxed Pullover",
   "note": "Rack 13 confirmed; ignore stale slot 8."
  },
  {
   "key": "FBMP:10168118517365550",
   "rack": "POD 2 · CUSTOM",
   "bin": "BIN 40",
   "legacy": "V 5973",
   "cat": "DRESSES-0612",
   "color": "Black Dresses",
   "title": "Santé Classics Midi Dress WMNS One Size Black Floral Rayon Artsy Eclectic Boho",
   "note": "Bin 40 physically confirmed."
  }
 ],
 "picked": {},
 "flags": {}
}</script>

<script id="code">
(function(){
  var STATE=JSON.parse(document.getElementById('state').textContent);
  var app=document.getElementById('app'),chip=document.getElementById('savechip');
  var readOnly=false,pubTimer=null,art=null,artReady=false;

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function stamp(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),
    ap=h>=12?'pm':'am';h=h%12||12;return h+':'+(m<10?'0':'')+m+' '+ap;}

  function render(){
    document.getElementById('h-title').textContent=STATE.title;
    document.getElementById('h-sub').textContent=STATE.sub;
    document.getElementById('h-build').textContent=STATE.build;
    var h='',lastRack='',n=0;
    STATE.items.forEach(function(it){
      n++;
      if(it.rack!==lastRack){h+='<div class="rack">'+esc(it.rack)+'</div>';lastRack=it.rack;}
      var p=STATE.picked[it.key],f=STATE.flags[it.key];
      h+='<div class="item'+(p?' picked':'')+(f?' flagged':'')+'" data-key="'+esc(it.key)+'">'
        +'<div class="num">'+(p?'✓':n)+'</div><div class="body">'
        +'<div class="l1">'+esc(it.bin)
        +(it.legacy?'<span class="sep">·</span><span class="sku">'+esc(it.legacy)+'</span>':'')
        +'<span class="sep">·</span><span class="cat">'+esc(it.cat)+'</span></div>'
        +(p&&p.at?'<div class="when">picked '+esc(p.at)+'</div>':'')
        +'<div class="detail">'
        +'<div class="l2">'+esc(it.color)+'</div>'
        +'<div class="l3">'+esc(it.title)+'</div>'
        +(it.note?'<div class="note"><b>'+esc(it.note)+'</b></div>':'')
        +(f?'<div class="flagged-note">Flagged NOT AT BIN — Claude reads this in the morning and will chase the location.</div>':'')
        +'<button type="button" class="flagbtn">⚑ Not at this bin</button>'
        +'</div></div></div>';
    });
    if(STATE.gap)h+='<div class="gap">'+esc(STATE.gap)+'</div>';
    app.innerHTML=h;
    var done=Object.keys(STATE.picked).length;
    document.getElementById('count').textContent=done+' of '+STATE.items.length+' picked';
    document.getElementById('dots').innerHTML=STATE.items.map(function(it){
      return '<i class="dot'+(STATE.picked[it.key]?' on':'')+'"></i>';}).join('');
  }

  function pageSource(){
    var css=document.getElementById('s').textContent;
    var code=document.getElementById('code').textContent;
    var json=JSON.stringify(STATE,null,1).replace(/<\//g,'<\\/');
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">'
      +'<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
      +'<title>RRR Pick List</title><style id="s">'+css+'</style></head><body>'
      +'<div class="wrap"><h1 id="h-title"></h1><div class="sub" id="h-sub"></div>'
      +'<div class="build"><span id="h-build"></span><span class="live" id="savechip">SAVES ON TAP</span></div>'
      +'<div id="app"></div>'
      +'<div class="hint">Tap a row to mark it picked — it publishes itself a moment later, '
      +'so it holds on every device and Claude reads it in the morning.</div></div>'
      +'<div class="bar"><div class="barin"><span class="count" id="count"></span>'
      +'<span class="dots" id="dots"></span>'
      +'<button class="reset" type="button" id="unpick">Reset</button></div></div>'
      +'<footer>RRR sold pick list · self-saving card (v2.4 delivery)</footer>'
      +'<script type="application/json" id="state">'+json+'<\/'+'script>'
      +'<script id="code">'+code+'<\/'+'script></body></html>';
  }

  function setChip(cls,txt){chip.className='live'+(cls?' '+cls:'');chip.textContent=txt;}

  function schedulePublish(){
    if(readOnly)return;
    setChip('saving','SAVING…');
    clearTimeout(pubTimer);
    pubTimer=setTimeout(doPublish,1600);
  }
  function doPublish(){
    ensureArt().then(function(a){
      if(!a){readOnly=true;setChip('ro','READ-ONLY VIEW');return;}
      a.publish(pageSource()).then(function(){
        setChip('','SAVED');   // view reloads to the new version right after
      }).catch(function(e){
        var code=e&&e.code;
        if(code==='not_writer'||code==='not_granted'){readOnly=true;setChip('ro','READ-ONLY VIEW');}
        else if(code==='conflict'){setChip('','SYNCING…');} // shell reloads to winner
        else if(code==='rate_limited'){setChip('saving','SAVING…');clearTimeout(pubTimer);pubTimer=setTimeout(doPublish,5000);}
        else{setChip('saving','RETRYING…');clearTimeout(pubTimer);pubTimer=setTimeout(doPublish,4000);}
      });
    });
  }
  function ensureArt(){
    if(artReady)return Promise.resolve(art);
    var use=window.claude&&window.claude.use;
    if(!use)return Promise.resolve(null);
    return window.claude.use('artifact').then(function(a){artReady=true;art=a;return a;});
  }

  app.addEventListener('click',function(e){
    var fb=e.target.closest('.flagbtn');
    var row=e.target.closest('.item');
    if(!row)return;
    var key=row.getAttribute('data-key');
    if(fb){
      if(STATE.flags[key])delete STATE.flags[key];else STATE.flags[key]={at:stamp()};
    }else{
      if(STATE.picked[key])delete STATE.picked[key];else STATE.picked[key]={at:stamp()};
    }
    render();schedulePublish();
  });
  document.getElementById('unpick').addEventListener('click',function(){
    STATE.picked={};STATE.flags={};render();schedulePublish();
  });

  render();
})();
</script>

</body></html>
