<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick List — 2026-08-14</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#14181f; --mute:#6b7480;
    --line:#e3e6ea; --key:#1f6feb; --warn:#b45309; --warnbg:#fff8ec;
    --move:#7c3aed; --movebg:#f7f3ff; --done:#15803d; --donebg:#f2fbf5;
    --local:#a4560a; --localbg:#fff7ed;
    --unk:#b91c1c; --unkbg:#fef2f2;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;padding:24px 18px calc(86px + env(safe-area-inset-bottom));
    background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  form{max-width:700px;margin:0 auto;counter-reset:picked}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--mute);font-size:13.5px}
  .rack{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--mute);
    margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .chk{position:absolute;opacity:0;width:1px;height:1px;margin:0;padding:0;
    border:0;pointer-events:none;appearance:none;-webkit-appearance:none;}
  .item{display:flex;gap:15px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:11px;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    transition:background .2s ease,border-color .2s ease,padding .25s ease;}
  .chk:focus-visible + .item{outline:2px solid var(--key);outline-offset:2px}
  .num{flex:0 0 27px;height:27px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
    margin-top:1px;transition:background .2s ease;position:relative;}
  .num .tick{display:none;position:absolute;font-size:15px;line-height:1}
  .body{flex:1;min-width:0}
  .l1{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;
    font-weight:600;letter-spacing:-.01em}
  .l1 .sku{color:var(--key)} .l1 .cat{color:var(--mute);font-weight:500}
  .l1 .sep{color:#c4cad2;font-weight:400;padding:0 3px}
  .detail{display:grid;grid-template-rows:1fr;margin-top:6px;
    transition:grid-template-rows .25s ease,opacity .2s ease,margin .25s ease;}
  .detail>.inner{overflow:hidden;min-height:0}
  .l2{font-size:14px;font-weight:600;margin-bottom:3px}
  .l3{font-size:13.5px;line-height:1.4;color:#3a424e;margin-bottom:5px}
  .l4{font-size:12.5px;color:var(--mute)}
  .l4 b{color:var(--ink);font-weight:600}
  .mig{margin-top:7px;font-size:12px;color:var(--mute);display:flex;gap:7px;align-items:baseline}
  .mig .chip{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.08em;
    padding:2px 6px;border-radius:3px;background:#eef1f5;color:#69727e}
  .mig.moved{color:#5b21b6} .mig.moved .chip{background:var(--movebg);color:var(--move)}
  .mig.unver{color:#7c4a06} .mig.unver .chip{background:var(--warnbg);color:var(--warn)}
  .mig.local{color:#7c4a06} .mig.local .chip{background:var(--localbg);color:var(--local)}
  .mig.unknown{color:#991b1b} .mig.unknown .chip{background:var(--unkbg);color:var(--unk)}
  .item.unknown{border-color:#f0b4b4;border-left:4px solid var(--unk);background:#fffcfc}
  .item.unknown .num{background:var(--unk)}
  .mig.aging .chip{background:#fef3c7;color:#92400e}
  .mig.aging{border-left-color:#f59e0b}
  .build{max-width:700px;margin:2px auto 0;font-size:12px;color:var(--mute);
    letter-spacing:.02em}
  .degraded{max-width:700px;margin:14px auto 0;padding:10px 13px;border-radius:9px;
    background:var(--unkbg);border:1px solid #f4c2c2;color:#991b1b;font-size:12.5px}
  .degraded b{color:#7f1d1d}
  .inferred{max-width:700px;margin:14px auto 0;padding:10px 13px;border-radius:9px;
    background:#f2fbf5;border:1px solid #cfead8;color:#14532d;font-size:12.5px}
  .mig .from{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .note{margin-top:9px;padding:7px 10px;background:var(--warnbg);border-left:3px solid var(--warn);
    border-radius:0 5px 5px 0;font-size:12.5px;color:#7c4a06}
  .chk:checked + .item{background:var(--donebg);border-color:#cfead8;
    padding-top:11px;padding-bottom:11px;counter-increment:picked}
  .chk:checked + .item .num{background:var(--done)}
  .chk:checked + .item .num .n{display:none}
  .chk:checked + .item .num .tick{display:block}
  .chk:checked + .item .l1{opacity:.5;text-decoration:line-through;
    text-decoration-color:rgba(21,128,61,.45)}
  .chk:checked + .item .detail{grid-template-rows:0fr;opacity:0;margin-top:0}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:9;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;}
  .barin{max-width:700px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px}
  .count{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .count::after{content:counter(picked) " of 4 picked"}
  .dots{flex:1;display:flex;gap:5px}
  .dot{flex:1;height:6px;border-radius:3px;background:#e0e4e9;transition:background .25s ease}
  form:has(#p1:checked) .d1,
  form:has(#p2:checked) .d2,
  form:has(#p3:checked) .d3,
  form:has(#p4:checked) .d4{background:var(--done)}
  .reset,.exp{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;
    color:var(--mute);border-radius:7px;padding:7px 13px;cursor:pointer;
    -webkit-appearance:none;appearance:none;}
  .exp{background:var(--key);border-color:var(--key);color:#fff;font-weight:600}
  .hint{margin-top:16px;font-size:12px;color:var(--mute);text-align:center}
  .gap{max-width:700px;margin:18px auto 0;font-size:12px;color:#92400e;text-align:center}
  .wrap{max-width:640px;margin:26px auto 0;padding:0 16px}
  .wrap table{width:100%;border-collapse:collapse;font-size:16px}
  .wrap td{padding:13px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .wrap td.n{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;
    white-space:nowrap;padding-left:14px;font-size:19px}
  .wrap tr.tot td{border-bottom:none;border-top:2px solid var(--ink);font-weight:700}
  .wrap .lab{font-weight:600}
  .wrap .det{display:block;font-size:13px;color:var(--mute);margin-top:3px;line-height:1.5}
  .done-h{max-width:640px;margin:22px auto 0;padding:0 16px;font-size:15px;color:var(--mute)}
  footer{margin-top:22px;font-size:12px;color:var(--mute);text-align:center;line-height:1.6}
  @media print{
    body{background:#fff;padding:0}
    .bar,.hint{display:none}
    .item{break-inside:avoid;cursor:auto}
    .chk:checked + .item{background:#fff;padding:15px 17px}
    .chk:checked + .item .detail{grid-template-rows:1fr;opacity:1;margin-top:6px}
    .chk:checked + .item .l1{opacity:1;text-decoration:none}
  }
</style>
</head>

<script>var DATEKEY="2026-08-14";
function exportPicked(){
  var picked=[].slice.call(document.querySelectorAll('.chk:checked'))
              .map(function(c){return c.dataset.key;});
  if(!picked.length){alert('Nothing checked yet.');return;}
  var doc={schema:'rrr-picked/1.0',exported_at:new Date().toISOString(),
           list_date:DATEKEY,source:'iphone-export',picked:picked};
  var name='picked-'+DATEKEY+'-'+new Date().toISOString().slice(11,19).replace(/:/g,'')+'.json';
  var b=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u);},1500);
}
</script>
